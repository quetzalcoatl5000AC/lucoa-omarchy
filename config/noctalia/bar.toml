# ╔══════════════════════════════════════════════════════════════╗
# ║ 🌸 LUCOA / NOCTALIA BAR                                    ║
# ╚══════════════════════════════════════════════════════════════╝

[theme]
mode = "dark"

[shell.animation]
enabled = true
speed = 0.40

[bar.main]
position = "top"

thickness = 33

# Mais transparente = mais do tema/wallpaper aparecendo.
background_opacity = 0.62

radius = 16
margin_ends = 110
margin_edge = 8

padding = 10
widget_spacing = 6

scale = 1.0
font_scale = 1.0

shadow = true
reserve_space = true

capsule = true

# ──────────────────────────────────────────────────────────────
# 🌸 CAPSULES
# ──────────────────────────────────────────────────────────────

capsule_fill = "#5a123f"
capsule_opacity = 0.78

capsule_border = "#ff69b4"
capsule_border_width = 1

# ──────────────────────────────────────────────────────────────
# 📦 WIDGETS
# ──────────────────────────────────────────────────────────────

start = [
  "launcher",
  "workspaces",
  "active_window"
]

center = [
  "clock"
]

end = [
  "media",
  "network",
  "volume",
  "battery",
  "tray",
  "notifications"
]


# ──────────────────────────────────────────────────────────────
# 🕐 CLOCK
# ──────────────────────────────────────────────────────────────

[widget.clock]
type = "clock"
color = "#ff9dcc"


# ──────────────────────────────────────────────────────────────
# 🎵 MEDIA
# ──────────────────────────────────────────────────────────────

[widget.media]
type = "media"
color = "#ff9dcc"


# ──────────────────────────────────────────────────────────────
# 🌐 NETWORK
# ──────────────────────────────────────────────────────────────

[widget.network]
type = "network"
color = "#ff9dcc"


# ──────────────────────────────────────────────────────────────
# 🔊 VOLUME
# ──────────────────────────────────────────────────────────────

[widget.volume]
type = "volume"
color = "#ff9dcc"


# ──────────────────────────────────────────────────────────────
# 🔋 BATTERY
# ──────────────────────────────────────────────────────────────

[widget.battery]
type = "battery"
color = "#ff9dcc"


# ──────────────────────────────────────────────────────────────
# 📦 TRAY
# ──────────────────────────────────────────────────────────────

[widget.tray]
type = "tray"
color = "#ff9dcc"


# ──────────────────────────────────────────────────────────────
# 🔔 NOTIFICATIONS
# ──────────────────────────────────────────────────────────────

[widget.notifications]
type = "notifications"
color = "#ff9dcc"


# ──────────────────────────────────────────────────────────────
# 🪟 ACTIVE WINDOW
# ──────────────────────────────────────────────────────────────

[widget.active_window]
type = "active_window"
color = "#fff0f8"


# ──────────────────────────────────────────────────────────────
# 🧭 WORKSPACES
# ──────────────────────────────────────────────────────────────

[widget.workspaces]
type = "workspaces"


# ──────────────────────────────────────────────────────────────
# 🌸 LAUNCHER
# ──────────────────────────────────────────────────────────────

[widget.launcher]
type = "launcher"
color = "#ff69b4"