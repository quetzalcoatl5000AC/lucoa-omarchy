# ╔══════════════════════════════════════════════════════════════╗
# ║ 🐉 LUCOA KITTY                                              ║
# ╚══════════════════════════════════════════════════════════════╝

# ── Fonte ──────────────────────────────────────────────────────
font_family JetBrainsMono Nerd Font
font_size 12.5

# ── Cores ──────────────────────────────────────────────────────
foreground              #e8e3ea
background              #0b0a0f

selection_foreground    #ffffff
selection_background    #3a3542

cursor                  #b7ff6a
cursor_text_color       #0b0a0f

url_color               #b7ff6a

# ── ANSI ───────────────────────────────────────────────────────
color0  #17151c
color1  #ff6b81
color2  #a8e063
color3  #e6cf6a
color4  #8fa7ff
color5  #c59cff
color6  #78dce8
color7  #d8d3dc

color8  #4c4754
color9  #ff8798
color10 #b7f27d
color11 #f0df88
color12 #a7b8ff
color13 #d5b8ff
color14 #8cecf5
color15 #f2edf5

# ── Janela ─────────────────────────────────────────────────────
window_padding_width 12
window_margin_width 0

background_opacity 0.94
dynamic_background_opacity yes

hide_window_decorations yes
confirm_os_window_close 0

# ── Cursor / interação ────────────────────────────────────────
cursor_shape block
cursor_blink_interval 0

enable_audio_bell no
visual_bell_duration 0

# ── Tabs ───────────────────────────────────────────────────────
tab_bar_style powerline
tab_powerline_style slanted
active_tab_foreground   #0b0a0f
active_tab_background   #b7ff6a
inactive_tab_foreground #aaa5af
inactive_tab_background #17151c

# ── Scrollback ─────────────────────────────────────────────────
scrollback_lines 10000

# ── URLs ───────────────────────────────────────────────────────
detect_urls yes
underline_hyperlinks always

# ── Performance ────────────────────────────────────────────────
repaint_delay 8
input_delay 3
sync_to_monitor yes
